name: Generate Contribution Snake

on:
  # Run automatically every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual execution anytime from the GitHub Actions tab
  workflow_dispatch:
  # Run on push to main branch, ignoring pure documentation and asset changes
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README-ASSET-GUIDE.md'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#00F0FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F0FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Snake Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg || true
          git commit -m "chore(telemetry): update GitHub contribution snake visual [skip ci]" || echo "No changes to commit"
          git push
