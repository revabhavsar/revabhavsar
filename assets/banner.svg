<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="50%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="magentaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0E1A2F" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#00F0FF" fill-opacity="0.25"/>
    </pattern>

    <!-- Isometric Cube Pattern for Unity/3D motif -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2D4A" />
    </pattern>
  </defs>

  <style>
    .title-name {
      font-family: 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: 7px;
      fill: #FFFFFF;
    }
    .hud-code {
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      letter-spacing: 2.5px;
      fill: #00F0FF;
    }
    .hud-meta {
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #6E88B5;
    }
    .role-badge-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 3px;
      fill: #00F0FF;
    }
    .tagline-text {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-weight: 500;
      font-style: italic;
      font-size: 19px;
      letter-spacing: 1.5px;
      fill: #E2E8F0;
    }
    .desc-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 13.5px;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.35; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(400px); }
    }
    .pulsing {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>

  <!-- Outer Background -->
  <rect width="1000" height="400" fill="url(#bgGrad)"/>
  <rect width="1000" height="400" fill="url(#techGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="160" fill="#00F0FF" fill-opacity="0.06" filter="url(#cyanGlow)"/>
  <circle cx="850" cy="200" r="180" fill="#9D4EDD" fill-opacity="0.08" filter="url(#magentaGlow)"/>
  <circle cx="500" cy="380" r="220" fill="#00FFA3" fill-opacity="0.04" filter="url(#cyanGlow)"/>

  <!-- Holographic Wireframe Cube (Unity / 3D Motif) -->
  <g transform="translate(840, 185) scale(0.95)" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <!-- Isometric Cube Outer -->
    <path d="M 0 -70 L 60 -35 L 60 35 L 0 70 L -60 35 L -60 -35 Z" stroke="#00F0FF" stroke-opacity="0.6"/>
    <path d="M 0 -70 L 0 70" stroke="#9D4EDD" stroke-opacity="0.4"/>
    <path d="M -60 -35 L 60 35" stroke="#00F0FF" stroke-opacity="0.3"/>
    <path d="M 60 -35 L -60 35" stroke="#00F0FF" stroke-opacity="0.3"/>
    <!-- Inner Core -->
    <circle cx="0" cy="0" r="14" fill="#00F0FF" fill-opacity="0.15" stroke="#00FFA3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#00F0FF" filter="url(#cyanGlow)"/>
    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="75" ry="32" stroke="#9D4EDD" stroke-opacity="0.45" stroke-dasharray="4,6" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="75" ry="32" stroke="#00F0FF" stroke-opacity="0.4" stroke-dasharray="3,5" transform="rotate(35)"/>
  </g>

  <!-- Cybernetic / Robotics Axis Overlay (Left Accent) -->
  <g transform="translate(65, 180) scale(0.85)" opacity="0.35">
    <circle cx="0" cy="0" r="50" stroke="#6E88B5" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="70" stroke="#00F0FF" stroke-width="0.8" fill="none"/>
    <path d="M -85 0 L 85 0 M 0 -85 L 0 85" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4,4"/>
    <polygon points="0,-70 5,-60 -5,-60" fill="#00F0FF"/>
    <polygon points="70,0 60,5 60,-5" fill="#00F0FF"/>
    <text x="75" y="16" class="hud-meta" fill="#00F0FF" font-size="9">AXIS_X</text>
    <text x="-30" y="-75" class="hud-meta" fill="#00F0FF" font-size="9">AXIS_Y</text>
  </g>

  <!-- Cyberpunk Frame Borders -->
  <rect x="20" y="20" width="960" height="360" rx="14" fill="none" stroke="#162A45" stroke-width="1.2"/>
  <rect x="28" y="28" width="944" height="344" rx="10" fill="none" stroke="#00F0FF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Precision HUD Corner Brackets -->
  <!-- Top-Left -->
  <path d="M 20 55 L 20 20 L 55 20" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <circle cx="20" cy="20" r="2.5" fill="#00FFA3"/>
  <!-- Top-Right -->
  <path d="M 945 20 L 980 20 L 980 55" fill="none" stroke="#9D4EDD" stroke-width="3" stroke-linecap="round" filter="url(#magentaGlow)"/>
  <circle cx="980" cy="20" r="2.5" fill="#FF007F"/>
  <!-- Bottom-Left -->
  <path d="M 20 345 L 20 380 L 55 380" fill="none" stroke="#9D4EDD" stroke-width="3" stroke-linecap="round" filter="url(#magentaGlow)"/>
  <circle cx="20" cy="380" r="2.5" fill="#FF007F"/>
  <!-- Bottom-Right -->
  <path d="M 945 380 L 980 380 L 980 345" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <circle cx="980" cy="380" r="2.5" fill="#00FFA3"/>

  <!-- Top Header HUD Strip -->
  <g transform="translate(45, 48)">
    <rect x="0" y="0" width="10" height="10" fill="#00FFA3" filter="url(#cyanGlow)" class="pulsing"/>
    <text x="20" y="9" class="hud-code">SYSTEM STATUS: ONLINE</text>
    <text x="210" y="9" class="hud-meta">// NODE: RSCOE.PUNE</text>
    <text x="370" y="9" class="hud-meta">// XR_CORE: v6.2 [ACTIVE]</text>

    <!-- Right-aligned HUD telemetry -->
    <text x="690" y="9" class="hud-meta" text-anchor="end">LATENCY: 14ms</text>
    <rect x="702" y="1" width="35" height="9" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="0.8"/>
    <text x="706" y="8" class="hud-code" font-size="8">SYNCED</text>
    <text x="895" y="9" class="hud-meta" text-anchor="end">SYS_CLOCK: REAL-TIME 3D</text>
  </g>

  <!-- Horizontal Tech Divider Top -->
  <line x1="45" y1="64" x2="955" y2="64" stroke="#1C314E" stroke-width="1"/>
  <line x1="45" y1="64" x2="280" y2="64" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Center Content Area -->
  <!-- Category Prefix -->
  <g transform="translate(70, 98)">
    <text x="0" y="0" class="hud-code" fill="#00F0FF">/// COMMAND CENTER // OPERATOR PROFILE</text>
  </g>

  <!-- MAIN NAME -->
  <g transform="translate(70, 160)">
    <!-- Cyan glow drop shadow -->
    <text x="2" y="2" class="title-name" fill="#00F0FF" fill-opacity="0.25" filter="url(#cyanGlow)">REVA BHAVSAR</text>
    <!-- Sharp Front Text -->
    <text x="0" y="0" class="title-name">REVA BHAVSAR</text>
    <!-- Cyberpunk accent mark -->
    <rect x="615" y="-48" width="12" height="12" fill="#00F0FF" filter="url(#cyanGlow)"/>
    <rect x="635" y="-48" width="28" height="3" fill="#9D4EDD"/>
  </g>

  <!-- ROLE PILLS CONTAINER -->
  <g transform="translate(70, 185)">
    <!-- Pill 1: Unity Developer -->
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="3.5" fill="#00F0FF" filter="url(#cyanGlow)"/>
    <text x="26" y="19" class="role-badge-text">UNITY DEVELOPER</text>

    <!-- Pill 2: AR/VR Engineer -->
    <rect x="192" y="0" width="170" height="28" rx="6" fill="#9D4EDD" fill-opacity="0.15" stroke="#9D4EDD" stroke-width="1.2"/>
    <circle cx="206" cy="14" r="3.5" fill="#FF007F" filter="url(#magentaGlow)"/>
    <text x="218" y="19" class="role-badge-text" fill="#D946EF">AR/VR ENGINEER</text>

    <!-- Pill 3: Robotics & Automation -->
    <rect x="374" y="0" width="235" height="28" rx="6" fill="#00FFA3" fill-opacity="0.1" stroke="#00FFA3" stroke-width="1.2"/>
    <circle cx="388" cy="14" r="3.5" fill="#00FFA3"/>
    <text x="400" y="19" class="role-badge-text" fill="#00FFA3">ROBOTICS &amp; AUTOMATION</text>
  </g>

  <!-- TAGLINE -->
  <g transform="translate(70, 252)">
    <line x1="0" y1="-8" x2="0" y2="38" stroke="#00F0FF" stroke-width="3" filter="url(#cyanGlow)"/>
    <text x="18" y="12" class="tagline-text">“Reality is optional. I build better ones.”</text>
    <text x="18" y="36" class="desc-text">Transforming ideas into interactive 3D worlds, immersive XR experiences, and intelligent engineering simulations.</text>
  </g>

  <!-- Bottom Telemetry HUD Strip -->
  <line x1="45" y1="335" x2="955" y2="335" stroke="#1C314E" stroke-width="1"/>
  <line x1="680" y1="335" x2="955" y2="335" stroke="#9D4EDD" stroke-width="1.5" stroke-opacity="0.8"/>

  <g transform="translate(45, 358)">
    <!-- Telemetry Indicators -->
    <text x="0" y="0" class="hud-meta">PRIMARY ENGINE:</text>
    <text x="105" y="0" class="hud-code" fill="#E2E8F0">UNITY 3D (URP/HDRP)</text>

    <text x="280" y="0" class="hud-meta">XR TOOLKIT:</text>
    <text x="365" y="0" class="hud-code" fill="#00F0FF">AR FOUNDATION / OPENXR</text>

    <text x="560" y="0" class="hud-meta">HARDWARE:</text>
    <text x="635" y="0" class="hud-code" fill="#00FFA3">ROBOTICS / SENSORS / CV</text>

    <text x="910" y="0" class="hud-meta" text-anchor="end">CLASS OF 2026</text>
  </g>
</svg>
