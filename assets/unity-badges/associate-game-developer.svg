<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="slotBgCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
  </defs>

  <style>
    .slot-meta { font-family: 'Fira Code', 'Consolas', monospace; font-size: 9px; fill: #6E88B5; letter-spacing: 1px; }
    .slot-tag { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #00F0FF; letter-spacing: 2px; }
    .slot-title { font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 800; font-size: 14px; fill: #FFFFFF; letter-spacing: 0.5px; }
    .slot-issuer { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 10px; fill: #94A3B8; letter-spacing: 1.5px; }
    .slot-warn { font-family: 'Fira Code', monospace; font-size: 8px; fill: #F59E0B; letter-spacing: 0.8px; font-weight: 600; }
    .slot-file { font-family: 'Fira Code', monospace; font-size: 8px; fill: #38BDF8; letter-spacing: 0.5px; }
  </style>

  <!-- Housing Frame with Dashed Border (Unambiguous Placeholder) -->
  <rect x="6" y="6" width="268" height="268" rx="10" fill="url(#slotBgCyan)" stroke="#162942" stroke-width="1.5"/>
  <rect x="12" y="12" width="256" height="256" rx="8" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6"/>

  <!-- Corner Brackets -->
  <path d="M 6 22 L 6 6 L 22 6" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 258 6 L 274 6 L 274 22" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 6 258 L 6 274 L 22 274" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 258 274 L 274 274 L 274 258" fill="none" stroke="#00F0FF" stroke-width="2"/>

  <!-- Slot Header -->
  <text x="140" y="32" class="slot-tag" text-anchor="middle">CERTIFIED ASSOCIATE</text>
  <line x1="30" y1="40" x2="250" y2="40" stroke="#162942" stroke-width="1"/>

  <!-- Center Placeholder Target Area -->
  <g transform="translate(140, 100)">
    <!-- Target Box -->
    <rect x="-45" y="-35" width="90" height="70" rx="6" fill="#0D1A2E" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
    <!-- Technical Crosshair -->
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <!-- Upload Symbol -->
    <path d="M 0 -12 L 0 10 M -8 -4 L 0 -12 L 8 -4" fill="none" stroke="#00FFA3" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="14" x2="14" y2="14" stroke="#00FFA3" stroke-width="2" stroke-linecap="round"/>
    <!-- Text Inside Box -->
    <text x="0" y="27" class="slot-meta" text-anchor="middle" font-size="7.5" fill="#38BDF8">AWAITING PNG</text>
  </g>

  <!-- Credential Details (Accurate Text) -->
  <text x="140" y="162" class="slot-issuer" text-anchor="middle">UNITY TECHNOLOGIES</text>
  <text x="140" y="182" class="slot-title" text-anchor="middle">GAME DEVELOPER</text>
  <text x="140" y="198" class="slot-meta" text-anchor="middle" fill="#00FFA3">● EXAM QUALIFIED</text>

  <!-- Notice Divider -->
  <line x1="30" y1="212" x2="250" y2="212" stroke="#162942" stroke-width="1"/>

  <!-- Placeholder Disclaimer & Filename instructions -->
  <text x="140" y="230" class="slot-warn" text-anchor="middle">[ PLACEHOLDER SLOT ]</text>
  <text x="140" y="244" class="slot-file" text-anchor="middle">DROP CREDLY PNG TO:</text>
  <text x="140" y="256" class="slot-file" text-anchor="middle" fill="#00F0FF">associate-game-developer.png</text>
</svg>
