<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A17"/>
      <stop offset="100%" stop-color="#06040A"/>
    </linearGradient>
    <linearGradient id="pPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .p-brand { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 2px; fill: #64748B; }
    .p-tag { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 2px; fill: #D946EF; }
    .p-title { font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 1px; fill: #FFFFFF; }
    .p-status { font-family: 'Fira Code', monospace; font-size: 8px; letter-spacing: 1.5px; fill: #A855F7; }
    .p-note { font-family: 'Fira Code', monospace; font-size: 7px; fill: #475569; }
  </style>

  <rect x="5" y="5" width="230" height="260" rx="10" fill="url(#pBg)" stroke="#261A3B" stroke-width="1.5"/>
  <rect x="5" y="5" width="230" height="260" rx="10" fill="none" stroke="#9D4EDD" stroke-opacity="0.25" stroke-width="1"/>

  <path d="M 5 20 L 5 5 L 20 5" fill="none" stroke="#9D4EDD" stroke-width="2"/>
  <path d="M 220 5 L 235 5 L 235 20" fill="none" stroke="#9D4EDD" stroke-width="2"/>
  <path d="M 5 250 L 5 265 L 20 265" fill="none" stroke="#9D4EDD" stroke-width="2"/>
  <path d="M 220 265 L 235 265 L 235 250" fill="none" stroke="#9D4EDD" stroke-width="2"/>

  <!-- Pathway Header -->
  <rect x="25" y="16" width="190" height="18" rx="4" fill="#9D4EDD" fill-opacity="0.12" stroke="#9D4EDD" stroke-width="0.8"/>
  <text x="120" y="29" class="p-tag" text-anchor="middle">LEARNING PATHWAY</text>

  <!-- Unity Pathway Emblem Motif -->
  <g transform="translate(120, 88)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#18112B" stroke="#9D4EDD" stroke-width="1.6" filter="url(#pGlow)"/>
    <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="url(#pPurple)" fill-opacity="0.3" stroke="#D946EF" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#D946EF" stroke-width="1"/>
    <line x1="0" y1="0" x2="-18" y2="-10" stroke="#D946EF" stroke-width="1"/>
    <line x1="0" y1="0" x2="18" y2="-10" stroke="#D946EF" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <text x="120" y="152" class="p-brand" text-anchor="middle">UNITY LEARN</text>
  <text x="120" y="172" class="p-title" text-anchor="middle">UNITY ESSENTIALS</text>
  <text x="120" y="190" class="p-status" text-anchor="middle">● PATHWAY COMPLETED</text>

  <line x1="25" y1="208" x2="215" y2="208" stroke="#261A3B" stroke-width="1"/>

  <text x="120" y="228" class="p-note" text-anchor="middle">REPLACE WITH BADGE PNG AT:</text>
  <text x="120" y="242" class="p-note" fill="#D946EF" text-anchor="middle">pathway-essentials.png</text>
</svg>
