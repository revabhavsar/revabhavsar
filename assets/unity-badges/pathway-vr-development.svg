  <line x1="25" y1="38" x2="235" y2="38" stroke="#261A3B" stroke-width="1"/>

  <!-- Center Placeholder Target Area -->
  <g transform="translate(130, 92)">
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#18112B" stroke="#A855F7" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.3"/>
