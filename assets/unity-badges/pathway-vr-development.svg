    .p-issuer { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 9.5px; fill: #94A3B8; letter-spacing: 1.5px; }
    .p-warn { font-family: 'Fira Code', monospace; font-size: 7.5px; fill: #F59E0B; letter-spacing: 0.8px; font-weight: 600; }
    .p-file { font-family: 'Fira Code', monospace; font-size: 7.5px; fill: #C084FC; letter-spacing: 0.5px; }
  </style>

  <rect x="6" y="6" width="248" height="248" rx="10" fill="url(#pSlotBgVR)" stroke="#261A3B" stroke-width="1.5"/>
  <rect x="12" y="12" width="236" height="236" rx="8" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6"/>

  <path d="M 6 20 L 6 6 L 20 6" fill="none" stroke="#A855F7" stroke-width="2"/>
  <path d="M 240 6 L 254 6 L 254 20" fill="none" stroke="#A855F7" stroke-width="2"/>
  <path d="M 6 240 L 6 254 L 20 254" fill="none" stroke="#A855F7" stroke-width="2"/>
