<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 290" width="260" height="290">
  <defs>
    <linearGradient id="cardBgProg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#04070C"/>
    </linearGradient>
    <linearGradient id="badgeCyanProg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="bglowProg">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .b-brand { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 2px; fill: #64748B; }
    .b-type { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #00FFA3; }
    .b-title { font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 1px; fill: #FFFFFF; }
    .b-sub { font-family: 'Fira Code', monospace; font-size: 8.5px; letter-spacing: 1.5px; fill: #00F0FF; }
    .b-note { font-family: 'Fira Code', monospace; font-size: 7.5px; letter-spacing: 0.8px; fill: #475569; }
  </style>

  <!-- Housing Frame -->
  <rect x="5" y="5" width="250" height="280" rx="12" fill="url(#cardBgProg)" stroke="#162942" stroke-width="1.5"/>
  <rect x="5" y="5" width="250" height="280" rx="12" fill="none" stroke="#00FFA3" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Corner Tech Brackets -->
  <path d="M 5 22 L 5 5 L 22 5" fill="none" stroke="#00FFA3" stroke-width="2"/>
  <path d="M 238 5 L 255 5 L 255 22" fill="none" stroke="#00FFA3" stroke-width="2"/>
  <path d="M 5 268 L 5 285 L 22 285" fill="none" stroke="#00FFA3" stroke-width="2"/>
  <path d="M 238 285 L 255 285 L 255 268" fill="none" stroke="#00FFA3" stroke-width="2"/>

  <!-- Top Credential Tier Header -->
  <rect x="30" y="16" width="200" height="20" rx="4" fill="#00FFA3" fill-opacity="0.1" stroke="#00FFA3" stroke-width="0.8"/>
  <text x="130" y="30" class="b-type" text-anchor="middle">CERTIFIED ASSOCIATE</text>

  <!-- Unity 3D Hexagon Emblem Motif -->
  <g transform="translate(130, 96)">
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="#0D1826" stroke="#00FFA3" stroke-width="1.8" filter="url(#bglowProg)"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="url(#badgeCyanProg)" fill-opacity="0.25" stroke="#00F0FF" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="24" stroke="#00F0FF" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-21" y2="-12" stroke="#00F0FF" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="21" y2="-12" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Credential Details -->
  <text x="130" y="168" class="b-brand" text-anchor="middle">UNITY TECHNOLOGIES</text>
  <text x="130" y="190" class="b-title" text-anchor="middle">PROGRAMMER</text>
  <text x="130" y="208" class="b-sub" text-anchor="middle">● VERIFIED CREDENTIAL</text>

  <!-- Divider -->
  <line x1="30" y1="225" x2="230" y2="225" stroke="#162942" stroke-width="1"/>

  <!-- Metadata / User guide placeholder note -->
  <text x="130" y="246" class="b-note" text-anchor="middle">PLACE YOUR CREDLY BADGE PNG AT:</text>
  <text x="130" y="260" class="b-note" fill="#38BDF8" text-anchor="middle">associate-programmer.png</text>
</svg>
