      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0"/>
      <stop offset="25%" stop-color="#9D4EDD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF007F" stop-opacity="1"/>
