<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1524"/>
      <stop offset="50%" stop-color="#142136"/>
      <stop offset="100%" stop-color="#0D1524"/>
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
    }

    .t-header-title {
      font-size: 12px;
      fill: #8EA6CA;
      letter-spacing: 0.5px;
    }

    .t-title {
      font-size: 15px;
      font-weight: 700;
      fill: #00F0FF;
      letter-spacing: 2px;
    }

    .t-prompt-path {
      font-size: 13px;
      fill: #8EA6CA;
      letter-spacing: 0.5px;
    }

    .t-cmd-text {
      font-size: 13px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }

    .t-dots {
      font-size: 13px;
      fill: #223755;
      letter-spacing: 1px;
    }

    .t-ok {
      font-size: 13px;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: 1px;
    }

    .t-badge-text {
      font-size: 12.5px;
      font-weight: 700;
      fill: #00F0FF;
      letter-spacing: 1.5px;
    }

    .t-label {
      font-size: 13px;
      font-weight: 600;
      fill: #D946EF;
      letter-spacing: 1px;
    }

    .t-value {
      font-size: 13px;
      fill: #F8FAFC;
      letter-spacing: 0.5px;
    }

    .t-value-accent {
      font-size: 13px;
      font-weight: 700;
      fill: #00FFA3;
      letter-spacing: 1px;
    }

    .t-active-prompt {
      font-size: 13px;
      fill: #00FFA3;
      letter-spacing: 0.5px;
    }

    /* Ambient Non-Blocking Micro-Animations */
    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .pulse-status { animation: pulseLed 2.5s infinite ease-in-out; }
    .blinking-cursor { animation: blinkCursor 0.9s infinite; }
  </style>

  <!-- Outer Console Frame with Thin Cyan Accent -->
  <rect x="5" y="5" width="810" height="470" rx="10" fill="url(#termBg)" stroke="#15263F" stroke-width="1.5"/>
  <rect x="5" y="5" width="810" height="470" rx="10" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Window Header Bar -->
  <path d="M 5 15 C 5 9.5 9.5 5 15 5 L 805 5 C 810.5 5 815 9.5 815 15 L 815 36 L 5 36 Z" fill="url(#headerGrad)"/>
  <line x1="5" y1="36" x2="815" y2="36" stroke="#1A2D47" stroke-width="1"/>

  <!-- Window Control Buttons (Red, Amber, Green) -->
  <circle cx="28" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="46" cy="20" r="5.5" fill="#FFBD2E"/>
  <circle cx="64" cy="20" r="5.5" fill="#27C93F" filter="url(#greenGlow)"/>

  <!-- Window Title -->
  <text x="410" y="24" class="mono t-header-title" text-anchor="middle">reva@command-center: ~/xr-workspace (REVA_OS v3.4)</text>

  <!-- Right-aligned Status Indicator -->
  <g transform="translate(735, 14)">
    <circle cx="0" cy="6" r="3.5" fill="#00FF66" class="pulse-status" filter="url(#greenGlow)"/>
    <text x="10" y="10" class="mono" font-size="10.5" fill="#00FF66" font-weight="700">ONLINE</text>
  </g>

  <!-- ======================================================== -->
  <!-- CONSOLE CONTENT (PERMANENTLY VISIBLE, ZERO OVERLAP RISK) -->
  <!-- ======================================================== -->

  <!-- Line 0: REVA_OS Header Title -->
  <g>
    <text x="36" y="70" class="mono t-title" filter="url(#cyanGlow)">REVA_OS // XR DEVELOPMENT ENVIRONMENT</text>
    <line x1="36" y1="84" x2="784" y2="84" stroke="#162942" stroke-width="1"/>
  </g>

  <!-- Line 1: Workspace path prompt -->
  <g>
    <text x="36" y="112" class="mono t-prompt-path">reva@command-center:~/xr-workspace</text>
  </g>

  <!-- Line 2: initialize unity-engine -->
  <g>
    <text x="36" y="146" class="mono t-cmd-text">&gt; initialize unity-engine</text>
    <text x="250" y="146" class="mono t-dots">................................................</text>
    <text x="690" y="146" class="mono t-ok">[ OK ]</text>
  </g>

  <!-- Line 3: loading ar-vr modules -->
  <g>
    <text x="36" y="174" class="mono t-cmd-text">&gt; loading ar-vr modules</text>
    <text x="240" y="174" class="mono t-dots">.................................................</text>
    <text x="690" y="174" class="mono t-ok">[ OK ]</text>
  </g>

  <!-- Line 4: connecting robotics toolkit -->
  <g>
    <text x="36" y="202" class="mono t-cmd-text">&gt; connecting robotics toolkit</text>
    <text x="280" y="202" class="mono t-dots">..........................................</text>
    <text x="690" y="202" class="mono t-ok">[ OK ]</text>
  </g>

  <!-- Line 5: compiling interactive systems -->
  <g>
    <text x="36" y="230" class="mono t-cmd-text">&gt; compiling interactive systems</text>
    <text x="295" y="230" class="mono t-dots">.......................................</text>
    <text x="690" y="230" class="mono t-ok">[ OK ]</text>
  </g>

  <!-- Line 6: rendering immersive worlds -->
  <g>
    <text x="36" y="258" class="mono t-cmd-text">&gt; rendering immersive worlds</text>
    <text x="280" y="258" class="mono t-dots">..........................................</text>
    <text x="690" y="258" class="mono t-ok">[ OK ]</text>
  </g>

  <!-- Line 7: [ SYSTEM ONLINE ] Badge Box -->
  <g>
    <rect x="36" y="286" width="180" height="26" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
    <text x="50" y="303" class="mono t-badge-text" filter="url(#cyanGlow)">[ SYSTEM ONLINE ]</text>
  </g>

  <!-- Line 8: IDENTITY -->
  <g>
    <text x="36" y="344" class="mono t-label">IDENTITY  :</text>
    <text x="145" y="344" class="mono t-value">REVA BHAVSAR</text>
    <text x="440" y="344" class="mono" font-size="11" fill="#4B6382">// XR / ROBOTICS ENGINEER</text>
  </g>

  <!-- Line 9: ENGINE -->
  <g>
    <text x="36" y="370" class="mono t-label">ENGINE    :</text>
    <text x="145" y="370" class="mono t-value">UNITY 3D (URP / HDRP)</text>
  </g>

  <!-- Line 10: SPECIALTY -->
  <g>
    <text x="36" y="396" class="mono t-label">SPECIALTY :</text>
    <text x="145" y="396" class="mono t-value">AR / VR / XR / ROBOTICS</text>
  </g>

  <!-- Line 11: STATUS -->
  <g>
    <text x="36" y="422" class="mono t-label">STATUS    :</text>
    <text x="145" y="422" class="mono t-value-accent">READY TO BUILD</text>
  </g>

  <!-- Line 12: Active Prompt with Blinking Cursor -->
  <g>
    <text x="36" y="454" class="mono t-active-prompt">reva@command-center:~$</text>
    <text x="230" y="454" class="mono" font-size="13" fill="#E2E8F0">unity-engine --mode=interactive</text>
    <rect x="500" y="441" width="9" height="15" fill="#00F0FF" class="blinking-cursor" filter="url(#cyanGlow)"/>
  </g>

  <!-- Scanline Screen Filter Overlay -->
  <rect x="5" y="36" width="810" height="439" fill="url(#scanlines)" pointer-events="none"/>
</svg>
