<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>

    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .t-header {
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      fill: #8EA6CA;
    }
    .t-title {
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      fill: #00F0FF;
    }
    .t-div {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      fill: #223B5D;
    }
    .t-cmd {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13.5px;
      fill: #94A3B8;
    }
    .t-ok {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 700;
      font-size: 13.5px;
      fill: #00FF66;
    }
    .t-online {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #00F0FF;
    }
    .t-lbl {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
      fill: #D946EF;
    }
    .t-val {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      fill: #F8FAFC;
    }
    .t-val-accent {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 700;
      font-size: 13px;
      fill: #00FFA3;
    }

    /* CSS Keyframe Animation Sequence */
    @keyframes lineFade {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .l0 { animation: lineFade 0.6s ease forwards 0.2s; opacity: 0; }
    .l1 { animation: lineFade 0.6s ease forwards 0.6s; opacity: 0; }
    .l2 { animation: lineFade 0.6s ease forwards 1.0s; opacity: 0; }
    .l3 { animation: lineFade 0.6s ease forwards 1.4s; opacity: 0; }
    .l4 { animation: lineFade 0.6s ease forwards 1.8s; opacity: 0; }
    .l5 { animation: lineFade 0.6s ease forwards 2.2s; opacity: 0; }
    .l6 { animation: lineFade 0.6s ease forwards 2.6s; opacity: 0; }
    .l7 { animation: lineFade 0.6s ease forwards 3.0s; opacity: 0; }
    .l8 { animation: lineFade 0.7s ease forwards 3.5s; opacity: 0; }
    .l9 { animation: lineFade 0.6s ease forwards 4.0s; opacity: 0; }
    .l10 { animation: lineFade 0.6s ease forwards 4.3s; opacity: 0; }
    .l11 { animation: lineFade 0.6s ease forwards 4.6s; opacity: 0; }
    .l12 { animation: lineFade 0.6s ease forwards 4.9s; opacity: 0; }
    .l13 { animation: lineFade 0.6s ease forwards 5.2s; opacity: 0; }

    .cursor {
      animation: blink 0.9s infinite;
      fill: #00F0FF;
    }
  </style>

  <!-- Terminal Housing with Glass Border -->
  <rect x="5" y="5" width="810" height="430" rx="10" fill="url(#termBg)" stroke="#15263F" stroke-width="1.5"/>
  <rect x="5" y="5" width="810" height="430" rx="10" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Window Title Bar -->
  <path d="M 5 15 C 5 9.5 9.5 5 15 5 L 805 5 C 810.5 5 815 9.5 815 15 L 815 38 L 5 38 Z" fill="url(#barGrad)"/>
  <line x1="5" y1="38" x2="815" y2="38" stroke="#1F3452" stroke-width="1"/>

  <!-- Window Control Buttons (Red, Amber, Green with glows) -->
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="21" r="6" fill="#27C93F" filter="url(#greenGlow)"/>

  <!-- Window Bar Text -->
  <text x="410" y="25" class="t-header" text-anchor="middle">reva@command-center: ~/xr-workspace (REVA_OS v3.4)</text>

  <!-- Right side status indicator -->
  <g transform="translate(735, 15)">
    <circle cx="0" cy="6" r="3.5" fill="#00FF66"/>
    <text x="10" y="10" class="t-header" font-size="10" fill="#00FF66">ONLINE</text>
  </g>

  <!-- Terminal Content Area -->
  <g transform="translate(36, 75)">
    <!-- Header Title -->
    <g class="l0">
      <text x="0" y="0" class="t-title" filter="url(#termGlow)">REVA_OS // XR DEVELOPMENT ENVIRONMENT</text>
    </g>

    <g class="l1">
      <text x="0" y="18" class="t-div">-------------------------------------------------------------</text>
    </g>

    <!-- Sequence Line 1 -->
    <g class="l2" transform="translate(0, 44)">
      <text x="0" y="0" class="t-cmd">&gt; initializing_unity_engine .........................</text>
      <text x="470" y="0" class="t-ok">[ OK ]</text>
    </g>

    <!-- Sequence Line 2 -->
    <g class="l3" transform="translate(0, 68)">
      <text x="0" y="0" class="t-cmd">&gt; loading_spatial_computing_modules ..................</text>
      <text x="470" y="0" class="t-ok">[ OK ]</text>
    </g>

    <!-- Sequence Line 3 -->
    <g class="l4" transform="translate(0, 92)">
      <text x="0" y="0" class="t-cmd">&gt; initializing_ar_vr_systems .........................</text>
      <text x="470" y="0" class="t-ok">[ OK ]</text>
    </g>

    <!-- Sequence Line 4 -->
    <g class="l5" transform="translate(0, 116)">
      <text x="0" y="0" class="t-cmd">&gt; loading_robotics_toolkit ...........................</text>
      <text x="470" y="0" class="t-ok">[ OK ]</text>
    </g>

    <!-- Sequence Line 5 -->
    <g class="l6" transform="translate(0, 140)">
      <text x="0" y="0" class="t-cmd">&gt; compiling_interactive_worlds .......................</text>
      <text x="470" y="0" class="t-ok">[ OK ]</text>
    </g>

    <!-- Sequence Line 6 -->
    <g class="l7" transform="translate(0, 164)">
      <text x="0" y="0" class="t-cmd">&gt; rendering_immersive_experiences ....................</text>
      <text x="470" y="0" class="t-ok">[ OK ]</text>
    </g>

    <!-- Status Box -->
    <g class="l8" transform="translate(0, 202)">
      <rect x="0" y="-18" width="540" height="26" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
      <text x="14" y="0" class="t-online" filter="url(#termGlow)">[ SYSTEM ONLINE // READY FOR SIMULATION ]</text>
    </g>

    <!-- Identity Key-Values -->
    <g class="l9" transform="translate(0, 238)">
      <text x="0" y="0" class="t-lbl">IDENTITY :</text>
      <text x="110" y="0" class="t-val">REVA BHAVSAR</text>
      <text x="400" y="0" class="t-cmd" font-size="11">// B.TECH ROBOTICS 2026</text>
    </g>

    <g class="l10" transform="translate(0, 260)">
      <text x="0" y="0" class="t-lbl">ROLE     :</text>
      <text x="110" y="0" class="t-val">UNITY XR DEVELOPER</text>
      <text x="400" y="0" class="t-cmd" font-size="11">// XR INTERN @ FIREBIRD VR</text>
    </g>

    <g class="l11" transform="translate(0, 282)">
      <text x="0" y="0" class="t-lbl">SPECIALTY:</text>
      <text x="110" y="0" class="t-val">AR / VR / ROBOTICS / 3D SIMULATION</text>
    </g>

    <g class="l12" transform="translate(0, 304)">
      <text x="0" y="0" class="t-lbl">STATUS   :</text>
      <text x="110" y="0" class="t-val-accent">BUILDING THE FUTURE</text>
    </g>

    <!-- Active Terminal Prompt with Blinking Cursor -->
    <g class="l13" transform="translate(0, 332)">
      <text x="0" y="0" class="t-cmd" fill="#00FFA3">reva@xr-node:~$</text>
      <text x="135" y="0" class="t-cmd" fill="#E2E8F0">unity-engine --mode=interactive --spatial-audio=on</text>
      <rect x="548" y="-12" width="9" height="15" class="cursor"/>
    </g>
  </g>

  <!-- Scanline Screen Filter Overlay -->
  <rect x="5" y="38" width="810" height="397" fill="url(#scanlines)" pointer-events="none"/>
</svg>
